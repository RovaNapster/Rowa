<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STORM9lite Terminal</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --neon: #00FF46;
            --bg: #020804;
        }
        body {
            background-color: var(--bg);
            color: var(--neon);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            text-shadow: 0 0 5px var(--neon);
        }
        /* CRT Scanline Effect */
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }
        h1 { font-size: 1.5rem; border-bottom: 2px solid var(--neon); padding-bottom: 10px; }
        textarea, input {
            background: transparent;
            color: var(--neon);
            border: 1px solid var(--neon);
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
            font-family: inherit;
            margin-bottom: 15px;
            outline: none;
        }
        button {
            background: var(--neon);
            color: var(--bg);
            border: none;
            padding: 15px;
            width: 100%;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            text-transform: uppercase;
        }
        button:active { background: #00cc38; }
        #output {
            margin-top: 20px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .glitch { animation: glitch 0.2s linear infinite; }
        @keyframes glitch {
            2%, 64% { transform: translate(2px, 0) skew(0deg); }
            4%, 60% { transform: translate(-2px, 0) skew(0deg); }
            62% { transform: translate(0, 0) skew(5deg); }
        }
    </style>
</head>
<body>

    <h1 id="title">STORM9lite // ACTIVE</h1>
    
    <label>INCOMING SIGNAL (Klartext eller Koord):</label>
    <textarea id="inputData" rows="4" placeholder="Ex: HONDA123 eller (2,3) (3,4)..."></textarea>
    
    <button onclick="processSignal()">ENCODE / DECODE</button>
    
    <div id="output"></div>

    <script>
        // Registrera Service Worker för Offline-läge
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .then(() => console.log('[*] Storm9 Service Worker aktiv.'));
        }

        // Rovanapster Matrix (5x5 + Siffror i Grupp 4)
        const matrixMap = {
            'A':[1,1], 'B':[1,2], 'C':[1,3], 'D':[1,4], 'E':[1,5],
            'F':[2,1], 'G':[2,2], 'H':[2,3], 'I':[2,4], 'J':[2,4], 'K':[2,5],
            'L':[3,1], 'M':[3,2], 'N':[3,3], 'O':[3,4], 'P':[3,5],
            'Q':[4,1], 'R':[4,2], 'S':[4,3], 'T':[4,4], 'U':[4,5],
            'V':[5,1], 'W':[5,2], 'X':[5,3], 'Y':[5,4], 'Z':[5,5],
            '1':[4,6], '2':[4,7], '3':[4,8], '4':[4,9], '5':[4,10],
            '6':[4,11], '7':[4,12], '8':[4,13], '9':[4,14], '0':[4,15]
        };

        function processSignal() {
            const input = document.getElementById('inputData').value.toUpperCase();
            const outputDiv = document.getElementById('output');
            
            // UI Glitch-effekt vid klick
            document.body.classList.add('glitch');
            setTimeout(() => document.body.classList.remove('glitch'), 200);

            if (input.includes('(')) {
                outputDiv.innerText = "[!] DECODING NOT YET IMPLEMENTED IN LITE VERSION.";
                // Här kan du bygga reverse-mapping om du vill
            } else {
                let coords = [];
                for (let char of input) {
                    if (matrixMap[char]) {
                        coords.push(`(${matrixMap[char][0]},${matrixMap[char][1]})`);
                    }
                }
                outputDiv.innerText = `[ENCODED SIGNAL]:\n${coords.join(' ')}`;
                
                // Nuclear trigger test
                if (input === "PURGE") {
                    outputDiv.innerText = "\n[!!!] PURGE INITIATED. CLEARING BROWSER CACHE...";
                    localStorage.clear();
                    setTimeout(() => document.body.innerHTML = "", 1000);
                }
            }
        }
    </script>
</body>
</html>
