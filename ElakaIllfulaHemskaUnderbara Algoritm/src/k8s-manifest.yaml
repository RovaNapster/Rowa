apiVersion: apps/v1
kind: Deployment
metadata:
  name: rova-nexus
  labels:
    app: rova-nexus
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rova-nexus
  template:
    metadata:
      labels:
        app: rova-nexus
    spec:
      containers:
      - name: app
        image: ghcr.io/YOUR_GITHUB_ORG/YOUR_REPO:main
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: rova-nexus
  labels:
    app: rova-nexus
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: rova-nexus
