## Security Considerations

### 1. Firewall

Tailscale handles its own encryption, but ensure:
- Outbound UDP 41641 is allowed
- Outbound HTTPS (443) is allowed
- No inbound port forwarding needed

### 2. Access Control

In Tailscale admin dashboard (https://login.tailscale.com):
- Set ACL rules to restrict access
- Only allow necessary users/devices
- Use tags for organization

### 3. Key Rotation

```bash
# To rotate the auth key (in Tailscale admin):
1. Go to Settings → Auth keys
2. Create new key
3. Revoke old key
4. Update GitHub secret
5. Restart container
```

### 4. Logging

```bash
# View access logs
docker logs tailscale | grep -i auth
docker logs tailscale | grep -i error
```

