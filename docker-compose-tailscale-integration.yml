## Usage Examples

### SSH via Tailscale

Once Tailscale is running on server:

```bash
# Get the Tailscale IP from server
TAILSCALE_IP=$(docker exec tailscale tailscale ip -4)

# SSH to server via VPN (no need to expose SSH port)
ssh -i ~/.ssh/lidbema_deploy deploy@$TAILSCALE_IP

# Or directly
ssh -i ~/.ssh/lidbema_deploy deploy@100.x.y.z
```

### Access Services via Tailscale IP

```bash
# Get Tailscale IP
TAILSCALE_IP=$(docker exec tailscale tailscale ip -4)

# Access Grafana
http://${TAILSCALE_IP}:3100

# Access Prometheus
http://${TAILSCALE_IP}:9090

# Access Lidbema PWA
http://${TAILSCALE_IP}:3000

# Access any service
http://${TAILSCALE_IP}:PORT
```

### Health Check

```bash
# Verify Tailscale is healthy
docker exec tailscale tailscale status

# Expected output:
# 100.x.y.z          lidbema-prod             linux   idle
```

