## Deployment Workflow with Tailscale

```
1. Deploy Tailscale on staging
   docker compose up -d tailscale

2. Get Tailscale IP
   docker exec tailscale tailscale ip -4
   # Output: 100.x.y.z

3. Connect locally
   tailscale up
   tailscale status

4. SSH to staging via VPN
   ssh -i ~/.ssh/lidbema_deploy deploy@100.x.y.z

5. Verify services accessible
   curl http://100.x.y.z:3100  # Grafana
   curl http://100.x.y.z:9090  # Prometheus

6. Deploy on production
   Same steps as staging

7. Update GitHub Actions
   Add Tailscale connection step

8. Test CI/CD deployment via VPN
   git push origin develop
```

