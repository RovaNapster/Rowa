## Optional: Advanced Configuration

### Route All Traffic Through Tailscale

```yaml
environment:
  - TS_AUTHKEY=${TAILSCALE_AUTH_KEY}
  - TS_EXTRA_ARGS=--advertise-routes=0.0.0.0/0 --accept-routes=true
```

### Use Specific Tailscale Version

```yaml
image: tailscale/tailscale:v1.62.0  # Specify version instead of latest
```

### Disable Auto Update

```yaml
environment:
  - TS_NO_AUTOUPDATE=true
```

### Custom State Directory

```yaml
volumes:
  - /custom/path/tailscale:/var/lib/tailscale
```

