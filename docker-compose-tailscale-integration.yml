## Troubleshooting

### Container Logs Show Errors

```bash
docker logs tailscale 2>&1 | head -50
```

### Can't Get Tailscale IP

```bash
# Wait 15 seconds for container to initialize
sleep 15
docker exec tailscale tailscale ip -4

# If still fails, check status
docker exec tailscale tailscale status

# Restart container
docker restart tailscale
```

### High Memory Usage

```bash
# Check memory
docker stats tailscale

# Restart if needed
docker restart tailscale
```

### Can't Connect from Local Machine

```bash
# Verify Tailscale running on server
docker exec tailscale tailscale status

# Install Tailscale locally
# https://tailscale.com/download

# Connect locally
tailscale up

# Check if connected to same network
tailscale status
```

