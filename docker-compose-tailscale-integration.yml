# Docker Compose with Tailscale VPN Integration

This is an optional addition to your existing docker-compose.yml
Add the tailscale service below to enable VPN connectivity.

---

## Add This Service to docker-compose.yml

```yaml
  # ============================================================================
  # TAILSCALE VPN SERVICE (Optional)
  # ============================================================================
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale-vpn
    cap_add:
      - NET_ADMIN
    volumes:
      - /var/lib/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTH_KEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=--advertise-routes=0.0.0.0/0
    networks:
      - monitoring-network
    restart: unless-stopped
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    healthcheck:
      test: ["CMD", "tailscale", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "app=tailscale"
      - "service=vpn"
```

---

## Step-by-Step Integration

### 1. Backup Current docker-compose.yml

```bash
cp docker-compose.yml docker-compose.yml.backup
```

### 2. Add Tailscale Service

Add the service definition above to your `docker-compose.yml` file,
just before the `networks:` section at the end.

### 3. Verify Syntax

```bash
docker compose config > /dev/null && echo "✓ Syntax OK"
```

### 4. Deploy Tailscale

```bash
# Set environment variable
export TAILSCALE_AUTH_KEY='tskey-client-ktMzc8Yx9411CNTRL-MEaT7AkPMPYCir6QvmzcPYNC4eQxEBQw'

# Deploy just Tailscale
docker compose up -d tailscale

# Or deploy all services
docker compose up -d
```

### 5. Verify Deployment

```bash
# Check if running
docker ps | grep tailscale

# Get Tailscale IP (wait 10-15 seconds)
docker exec tailscale tailscale ip -4

# Expected output: 100.x.y.z

# Check status
docker exec tailscale tailscale status
```

