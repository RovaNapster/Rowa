## Monitoring

### View Tailscale Logs

```bash
docker logs tailscale
docker logs -f tailscale  # Follow logs
docker logs --tail=50 tailscale  # Last 50 lines
```

### Check Network Status

```bash
# View connected devices in your Tailscale network
docker exec tailscale tailscale status

# View advertised routes
docker exec tailscale tailscale routes

# Ping another device
docker exec tailscale tailscale ping 100.x.y.a
```

### Docker Stats

```bash
docker stats tailscale
```

